{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Join TREMHUB{% endblock %}

{% block content %}
<div class="trem-auth-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-80">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg">
          <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
              <div class="trem-auth-logo mx-auto mb-3">T</div>
              <h2 class="fw-bold mb-1">Join TREMHUB</h2>
              <p class="text-muted">Create your community account</p>
            </div>
            <form method="post" data-success-message="Account created! Redirecting...">
              {% csrf_token %}
              {% crispy form %}
            </form>
            <hr>
            <p class="text-center text-muted mb-0 small">
              Already have an account? <a href="{% url 'accounts:login' %}" class="text-trem fw-semibold">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
