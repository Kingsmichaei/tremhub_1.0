{% extends 'base.html' %}

{% block title %}Delete {{ business.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body p-5">
          <div class="text-danger mb-3" style="font-size:3rem"><i class="bi bi-trash3"></i></div>
          <h4 class="fw-bold mb-2">Delete Business?</h4>
          <p class="text-muted mb-4">
            Are you sure you want to delete <strong>{{ business.name }}</strong>? This action cannot be undone.
          </p>
          <form method="post" class="d-flex gap-3 justify-content-center" data-success-message="Business deleted. Redirecting...">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-trash me-2"></i>Yes, Delete
            </button>
            <a href="{% url 'businesses:detail' business.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
